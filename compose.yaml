name: lan-uno

services:
  uno:
    image: lan-uno:local
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      UNO_ALLOWED_HOSTS: "39.104.71.170"
      UNO_OPEN_BROWSER: "0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"